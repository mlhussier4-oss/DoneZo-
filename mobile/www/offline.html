<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HomeHire: offline</title>
<style>
  body{margin:0;min-height:100vh;background:#14213d;color:#fff;font:17px/1.5 -apple-system,system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .mark{width:64px;height:64px;border-radius:16px;background:#f5c21b;color:#14213d;display:grid;place-items:center;margin:0 auto 20px}

</style></head>
<body><main>
  <div class="mark" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/><path d="M8.75 14.25 11 16.5l4.25-4.5"/></svg></div>

  <a href="https://homehire.us">Try again</a>
</main>
<script>window.addEventListener("online",function(){location.href="https://homehire.us"});</script>
</body></html>
