<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#0f172a">
  <h2 style="margin:0 0 16px">Welcome to HomeHire</h2>
  <p>Your confirmation code is:</p>
  <p style="font-size:28px;font-weight:bold;letter-spacing:6px;margin:8px 0 20px">{{ .Token }}</p>
  <p>Or confirm your email with this link:</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email{{ if .Data.signup_next }}&next={{ .Data.signup_next }}{{ end }}">Confirm my email</a></p>
  <p style="color:#64748b;font-size:13px">If you didn't request this, you can ignore this email.</p>
</div>
